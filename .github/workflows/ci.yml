name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The dependency list is the point of this job. It installs test tooling and nothing
  # else -- no Home Assistant, no third-party runtime libraries -- and runs the protocol
  # and register suites plus the purity check. If the shipped code ever grows a
  # dependency, this fails.
  core:
    name: Protocol and registers (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-asyncio hypothesis
      - run: python -m pytest tests/protocol tests/registers tests/test_purity.py -q

  integration:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-asyncio hypothesis pytest-homeassistant-custom-component
      - run: python -m pytest tests -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
