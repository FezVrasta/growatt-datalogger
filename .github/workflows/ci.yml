name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The point of this job is the dependency list: pytest and hypothesis, nothing else.
  # If the protocol layer ever grows a third-party or Home Assistant import, this fails.
  protocol:
    name: Protocol and registers (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest hypothesis
      - run: python -m pytest tests/protocol tests/registers tests/test_purity.py -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
