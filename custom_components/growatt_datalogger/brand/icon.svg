<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img" aria-label="Growatt Datalogger">
  <title>Growatt Datalogger</title>

  <defs>
    <!-- The light the leaf throws into the tile it sits in. Centred on the leaf's mass,
         which the optical correction leaves slightly right of and above the middle of
         the tile, rather than on the canvas, so the falloff reads as emission coming
         from the shape instead of as a decorative background gradient. -->
    <radialGradient id="spill" cx="51.5%" cy="49%" r="60%">
      <stop offset="0%"   stop-color="#31FF86" stop-opacity="0.30"/>
      <stop offset="38%"  stop-color="#15C062" stop-opacity="0.17"/>
      <stop offset="72%"  stop-color="#083B21" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="45%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="core" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#D8FFE6"/>
      <stop offset="100%" stop-color="#8CFFB8"/>
    </linearGradient>

    <!-- Bloom, halo, sheen, core. A single blur reads as a flat coloured smear; it is
         the near-white core inside a saturated halo that makes the stroke look lit.
         Intensity comes from stacking passes rather than from feComponentTransfer,
         which librsvg renders with a visible rectangular seam. -->
    <filter id="bloom" filterUnits="userSpaceOnUse" x="215" y="95" width="130" height="130">
      <feGaussianBlur stdDeviation="3.871"/>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="215" y="95" width="130" height="130">
      <feGaussianBlur stdDeviation="1.048"/>
    </filter>
    <filter id="sheen" filterUnits="userSpaceOnUse" x="215" y="95" width="130" height="130">
      <feGaussianBlur stdDeviation="0.323"/>
    </filter>

    <clipPath id="tile"><path d="M 657.4899 0 c 128.2906 0 192.4358 0 241.4363 24.9670 a 229.0688 229.0688 0 0 1 100.1067 100.1067 c 24.9670 49.0005 24.9670 113.1458 24.9670 241.4363 L 1024.0000 657.4899 c 0 128.2906 0 192.4358 -24.9670 241.4363 a 229.0688 229.0688 0 0 1 -100.1067 100.1067 c -49.0005 24.9670 -113.1458 24.9670 -241.4363 24.9670 L 366.5101 1024.0000 c -128.2906 0 -192.4358 0 -241.4363 -24.9670 a 229.0688 229.0688 0 0 1 -100.1067 -100.1067 c -24.9670 -49.0005 -24.9670 -113.1458 -24.9670 -241.4363 L 0 366.5101 c 0 -128.2906 0 -192.4358 24.9670 -241.4363 a 229.0688 229.0688 0 0 1 100.1067 -100.1067 c 49.0005 -24.9670 113.1458 -24.9670 241.4363 -24.9670 Z"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#040805"/>
    <rect width="1024" height="1024" fill="url(#spill)"/>

    <g transform="translate(512,498) scale(12.4) translate(-281.988,-157.261)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g filter="url(#bloom)" stroke="#1BFF70" stroke-width="4.0" opacity="0.62">
        <path d="M296,140C296,140 288.486,145.1 281,148C269.412,152.489 270,169 270,169C270,169 281.243,173.142 291,164C298.833,156.661 296,140 296,140Z"/><path d="M262,174C262,174 267.028,171.687 273.739,167.063C280.631,162.313 285,157 285,157"/>
      </g>
      <g filter="url(#bloom)" stroke="#3BFF8B" stroke-width="2.9" opacity="0.55">
        <path d="M296,140C296,140 288.486,145.1 281,148C269.412,152.489 270,169 270,169C270,169 281.243,173.142 291,164C298.833,156.661 296,140 296,140Z"/><path d="M262,174C262,174 267.028,171.687 273.739,167.063C280.631,162.313 285,157 285,157"/>
      </g>
      <g filter="url(#halo)" stroke="#5CFF9C" stroke-width="3.0" opacity="0.95">
        <path d="M296,140C296,140 288.486,145.1 281,148C269.412,152.489 270,169 270,169C270,169 281.243,173.142 291,164C298.833,156.661 296,140 296,140Z"/><path d="M262,174C262,174 267.028,171.687 273.739,167.063C280.631,162.313 285,157 285,157"/>
      </g>
      <g filter="url(#sheen)" stroke="#C8FFDD" stroke-width="2.7" opacity="0.9">
        <path d="M296,140C296,140 288.486,145.1 281,148C269.412,152.489 270,169 270,169C270,169 281.243,173.142 291,164C298.833,156.661 296,140 296,140Z"/><path d="M262,174C262,174 267.028,171.687 273.739,167.063C280.631,162.313 285,157 285,157"/>
      </g>
      <g stroke="url(#core)" stroke-width="2.2">
        <path d="M296,140C296,140 288.486,145.1 281,148C269.412,152.489 270,169 270,169C270,169 281.243,173.142 291,164C298.833,156.661 296,140 296,140Z"/><path d="M262,174C262,174 267.028,171.687 273.739,167.063C280.631,162.313 285,157 285,157"/>
      </g>
    </g>

    <rect width="1024" height="1024" fill="url(#vignette)"/>
    <!-- A faint top-edge highlight, the way a physical tile catches light. -->
    <path d="M 657.4899 0 c 128.2906 0 192.4358 0 241.4363 24.9670 a 229.0688 229.0688 0 0 1 100.1067 100.1067 c 24.9670 49.0005 24.9670 113.1458 24.9670 241.4363 L 1024.0000 657.4899 c 0 128.2906 0 192.4358 -24.9670 241.4363 a 229.0688 229.0688 0 0 1 -100.1067 100.1067 c -49.0005 24.9670 -113.1458 24.9670 -241.4363 24.9670 L 366.5101 1024.0000 c -128.2906 0 -192.4358 0 -241.4363 -24.9670 a 229.0688 229.0688 0 0 1 -100.1067 -100.1067 c -24.9670 -49.0005 -24.9670 -113.1458 -24.9670 -241.4363 L 0 366.5101 c 0 -128.2906 0 -192.4358 24.9670 -241.4363 a 229.0688 229.0688 0 0 1 100.1067 -100.1067 c 49.0005 -24.9670 113.1458 -24.9670 241.4363 -24.9670 Z" fill="url(#edge)"/>
  </g>
</svg>
