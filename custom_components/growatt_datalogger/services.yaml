read_register:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: growatt_datalogger
    target:
      default: inverter
      selector:
        select:
          options:
            - inverter
            - datalogger
    register:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    end_register:
      example: 10
      selector:
        number:
          min: 0
          max: 65535
          mode: box

write_register:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: growatt_datalogger
    target:
      default: inverter
      selector:
        select:
          options:
            - inverter
            - datalogger
    register:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      required: true
      example: 100
      selector:
        text:
    confirm:
      default: false
      selector:
        boolean:

sync_time:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: growatt_datalogger

write_registers:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: growatt_datalogger
    start_register:
      required: true
      example: 1100
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    values:
      required: true
      example: "[1560, 1740, 1]"
      selector:
        object:
    confirm:
      default: false
      selector:
        boolean:
