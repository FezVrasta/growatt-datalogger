[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growatt-protocol"
version = "0.7.0"
description = "The Growatt datalogger upload protocol (TCP 5279) and its register semantics"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Federico Zivolo" }]
keywords = ["growatt", "solar", "inverter", "datalogger", "shinewifi", "modbus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

# Deliberately empty, and enforced by tests/test_purity.py: the whole point of this
# package is that speaking to a Growatt datalogger needs nothing but the standard
# library. No compiled extension, so it installs anywhere Python runs -- which is what
# lets the Home Assistant integration depend on it without a build step.
dependencies = []

[project.urls]
Homepage = "https://github.com/FezVrasta/growatt-datalogger"
Source = "https://github.com/FezVrasta/growatt-datalogger/tree/main/packages/growatt-protocol"
Issues = "https://github.com/FezVrasta/growatt-datalogger/issues"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/growatt_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
