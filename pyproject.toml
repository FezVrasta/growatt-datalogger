[project]
name = "growatt-datalogger"
version = "0.1.0"
description = "Home Assistant custom component that replaces the Growatt cloud server locally"
requires-python = ">=3.13"
# Intentionally empty: the integration ships with zero runtime dependencies.
dependencies = []

[dependency-groups]
# Everything needed to run tests/protocol and tests/registers. These are test tools
# only -- the integration itself declares no runtime dependencies at all, and
# tests/test_purity.py enforces that by walking the source. Deliberately does NOT
# include Home Assistant: those suites must pass without it.
protocol = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "freezegun>=1.5",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
