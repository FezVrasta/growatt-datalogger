[project]
name = "growatt-datalogger-integration"
version = "0.1.0"
description = "Home Assistant custom component for Growatt dataloggers"
requires-python = ">=3.13"
# The integration itself declares its runtime requirement in manifest.json, which is
# what Home Assistant reads. This block exists only so the repository is installable
# for development.
dependencies = ["growatt-protocol"]

[dependency-groups]
dev = [
    "growatt-protocol",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6",
    "pytest-homeassistant-custom-component",
    "ruff>=0.8",
]

[tool.uv.sources]
growatt-protocol = { path = "packages/growatt-protocol", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
